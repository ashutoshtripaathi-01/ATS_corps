name: Deploy to Production

# ─────────────────────────────────────────────────────────────────────────
# Ex-Serviceman Jobs — production deployment pipeline.
#
# Triggers only on a push to main, or a manual run. Never on pull requests
# or other branches — there is no staging environment, so "main" IS
# production, and validate-then-deploy only makes sense gated this tightly.
#
# Architecture:
#   1. validate — install, typecheck, test, build. Nothing here can touch
#      the server; a failure here stops the pipeline before deploy even
#      starts.
#   2. deploy   — ships the artifact validate just built (never rebuilt on
#      the deploy job, so what was tested is byte-for-byte what ships),
#      swaps it into place on EC2, and verifies the live site afterwards.
#
# The two jobs share one concurrency group so a second push mid-deploy
# queues behind the first rather than racing it.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Default GITHUB_TOKEN permissions for every job: read-only. Nothing here
# opens a PR, writes an issue, or publishes a package, so nothing beyond
# checkout access is needed.
permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  # Hardcoded, not derived from any secret or input — this is the one
  # fact the --delete safety check in the deploy job is built around.
  FRONTEND_LIVE_DIR: /var/www/exservicemanjobs
  BACKEND_LIVE_DIR: /home/ec2-user/ATS_corps/server

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # VALIDATE — typecheck, test, lint (informational), build. Blocks deploy.
  # ═══════════════════════════════════════════════════════════════════════
  validate:
    name: Validate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}

    services:
      # Ephemeral database for the backend test suite only. initDb() builds
      # the full schema against it (see "Bootstrap test database" below);
      # nothing here is ever reachable from, or related to, production data.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atscorps_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history — needed to diff against the pre-push SHA below

      - name: Determine what changed
        id: changes
        # workflow_dispatch has no "before" SHA, and the very first push to a
        # branch reports it as 40 zeros — both mean "nothing to diff against",
        # so the safe default in either case is "treat everything as changed"
        # rather than silently skipping a backend deploy that was needed.
        #
        # Deliberately no `set -e` here: a failing `git diff` must be caught
        # and handled explicitly (fall back to backend=true), not left to
        # propagate. The earlier version piped `git diff` into `grep -q`,
        # which only reports the LAST command's exit status — if `git diff`
        # itself failed (for instance a force-push leaving $BEFORE
        # unreachable), grep would silently see empty input, report "no
        # match", and backend=false would ship — the opposite of the
        # documented safe default. git diff's own exit status is captured
        # explicitly below instead, so that failure mode is closed.
        run: |
          BEFORE="${{ github.event.before }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "No usable previous commit — treating backend as changed."
            exit 0
          fi

          DIFF_OUTPUT=$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>&1)
          DIFF_STATUS=$?

          if [ "$DIFF_STATUS" -ne 0 ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "::warning::git diff failed (exit $DIFF_STATUS) — defaulting to backend=true rather than risking a silently skipped backend deploy. Output: $DIFF_OUTPUT"
            exit 0
          fi

          if echo "$DIFF_OUTPUT" | grep -q '^server/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Frontend typecheck + production build
        # "build" runs `tsc -b && vite build` — a type error fails this step
        # exactly as it would fail a local build. Fatal: Vite build output
        # is what gets deployed, so nothing here can ship a broken bundle.
        #
        # VITE_API_URL is public information — it ends up in the bundle
        # either way — not a secret, so it's a plain literal here rather
        # than a GitHub secret. Vite freezes import.meta.env at build time:
        # with no .env file checked into git (by design — see .gitignore)
        # and nothing setting this previously, every build produced
        # `API_BASE = "undefined/api"`, breaking every frontend API call
        # including the one GoogleSignInButton makes to fetch the Google
        # client id — not a Google-specific bug, a missing build-time value.
        env:
          VITE_API_URL: https://api.exservicemanjobs.com
        run: npm run build

      # ── Frontend lint — informational only ──────────────────────────
      # `npm run lint` currently reports a pre-existing baseline unrelated
      # to this pipeline. Making it blocking today would fail every future
      # deploy, including ones that fix nothing it complains about. It
      # still runs on every build so regressions are visible in the log —
      # it is just not a merge/deploy gate until that baseline is cleared.
      - name: Frontend lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Backend typecheck
        working-directory: server
        run: npm run typecheck

      - name: Bootstrap test database schema
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: atscorps_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: npm run db:bootstrap

      - name: Backend tests
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: atscorps_ci
          DB_USER: postgres
          DB_PASSWORD: postgres
          # Test-only value — 32 'x' characters, satisfies the length check
          # signAccessToken() needs at runtime. Never used outside this job.
          JWT_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        run: npm test

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # DEPLOY — ships the validated artifact to EC2. Runs only after validate
  # passes, and only for a push to main or a manual run.
  # ═══════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to EC2
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download frontend build artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: frontend-dist
          path: dist

      # ── SSH setup ────────────────────────────────────────────────────
      # The private key is written to a runner-local temp file (cleaned up
      # unconditionally at the end of the job) rather than passed inline on
      # any command line. known_hosts comes from a secret the operator
      # populates once via `ssh-keyscan`, out of band — see the deployment
      # README for the exact command. This is what makes
      # StrictHostKeyChecking=yes possible: the host key is verified against
      # a value the operator vouched for, not accepted blindly.
      - name: Set up SSH
        run: |
          mkdir -p "$RUNNER_TEMP/.ssh"
          chmod 700 "$RUNNER_TEMP/.ssh"

          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > "$RUNNER_TEMP/.ssh/deploy_key"
          chmod 600 "$RUNNER_TEMP/.ssh/deploy_key"

          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > "$RUNNER_TEMP/.ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/.ssh/known_hosts"

          {
            echo "SSH_OPTS=-i $RUNNER_TEMP/.ssh/deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/.ssh/known_hosts -o ConnectTimeout=15"
          } >> "$GITHUB_ENV"

      - name: Verify SSH connectivity
        run: |
          # shellcheck disable=SC2086
          ssh $SSH_OPTS "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "echo connected"

      # ── Frontend: stage, then hand off to the root-owned helper ───────
      # The build is rsynced to a run-unique staging directory under the
      # deploy user's own home directory first — never straight into
      # /var/www. That directory is then renamed, unprivileged, to one
      # FIXED path (frontend-ready) that the privileged helper below reads
      # from — nothing here passes it an argument, so there is no path for
      # ec2-user-controlled input to reach a privileged command at all.
      #
      # All promotion logic — taking ownership of the staged build before
      # validating it (closing the TOCTOU a plain sudo'd mv/rm rule can only
      # narrow) and the single atomic symlink rename that makes $LIVE never
      # resolve to nothing mid-promotion — lives in
      # deploy/atscorps-deploy-frontend.sh, installed once on the server as
      # a root-owned, root-only-readable script. See DEPLOYMENT.md §3.1 for
      # the install steps, the one-time migration from a plain directory to
      # the symlink+slot layout it requires, and exactly what is and isn't
      # covered.
      - name: Deploy frontend
        run: |
          set -euo pipefail
          STAGE="/home/${{ secrets.EC2_USER }}/.deploy-staging/frontend-${{ github.run_id }}"

          # shellcheck disable=SC2086
          ssh $SSH_OPTS "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p '$STAGE'"

          # shellcheck disable=SC2086
          rsync -az --delete -e "ssh $SSH_OPTS" \
            dist/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$STAGE/"

          # shellcheck disable=SC2086
          ssh $SSH_OPTS "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -s -- "$STAGE" <<'REMOTE'
            set -euo pipefail
            STAGE="$1"
            READY="/home/ec2-user/.deploy-staging/frontend-ready"

            # Unprivileged normalize-and-sanity-check. Not itself a security
            # boundary (the helper re-validates after taking ownership) —
            # just a cheap fail-fast before invoking sudo at all.
            rm -rf "$READY"
            mv "$STAGE" "$READY"
            if [ ! -d "$READY" ] || [ -L "$READY" ] || [ ! -f "$READY/index.html" ]; then
              echo "::error::Staged build looks wrong before even handing off to the promotion helper — aborting"
              exit 1
            fi

            sudo /usr/local/sbin/atscorps-deploy-frontend
          REMOTE

      # ── Frontend health check, with automatic rollback ────────────────
      # Hits the real public URL from outside the box — the same request a
      # user would make — rather than checking localhost on the EC2
      # instance, which would prove Nginx started but not that the public
      # path (DNS, TLS, any CDN/proxy in front) actually works. On failure,
      # repoint the live symlink back to the previous slot via the
      # dedicated rollback helper (never deletes anything — the failed
      # build stays exactly where it was promoted to, for inspection), then
      # re-check once to confirm the rollback actually restored a working
      # site, and fail the job either way so a bad frontend deploy is never
      # silently left live. A 200 here only means the page loaded — it is
      # not a claim that every frontend feature behind it works.
      - name: Verify frontend health
        run: |
          set -euo pipefail

          check_frontend() {
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://exservicemanjobs.com/ || echo "000")
            [ "$CODE" = "200" ]
          }

          OK=false
          for i in $(seq 1 10); do
            if check_frontend; then OK=true; break; fi
            sleep 3
          done

          if [ "$OK" = "true" ]; then
            echo "Frontend OK (200)"
            exit 0
          fi

          echo "::error::Frontend did not return 200 after deploy — rolling back"
          # shellcheck disable=SC2086
          if ssh $SSH_OPTS "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "sudo /usr/local/sbin/atscorps-rollback-frontend"; then
            echo "::error::Rollback command succeeded — re-checking the site"
            ROLLBACK_OK=false
            for i in $(seq 1 10); do
              if check_frontend; then ROLLBACK_OK=true; break; fi
              sleep 3
            done
            if [ "$ROLLBACK_OK" = "true" ]; then
              echo "::error::Rolled back successfully — the previous release is live again. The failed release was NOT deleted; see DEPLOYMENT.md §4 to inspect it."
            else
              echo "::error::ROLLBACK RAN BUT THE SITE STILL ISN'T RESPONDING — manual intervention required."
            fi
          else
            echo "::error::ROLLBACK COMMAND ITSELF FAILED — manual intervention required. The broken release is still live."
          fi
          exit 1

      # ── Backend: only when server/ actually changed ───────────────────
      # No sudo is used for any of the file operations below — server/
      # lives inside the deploy user's own home directory, which they
      # already own. Only the systemctl calls are privileged, each a
      # complete literal string with no wildcard.
      #
      # $LIVE is a symlink rotating between two root-free, ec2-user-owned
      # slots (server-a / server-b) rather than a real directory that gets
      # renamed out and back in on every deploy — see DEPLOYMENT.md §3.1 for
      # the one-time migration this requires and why: with a plain
      # directory, promoting a release needs at least two renames (move the
      # old one out of the way, move the new one in), and there is an
      # inherent window between them where $LIVE resolves to nothing. With
      # a symlink, the only operation that changes what's live is a single
      # atomic rename of the link itself, so that window doesn't exist.
      #
      #   • .env lives only on the box (gitignored, never in this
      #     checkout) and is copied from the currently-live slot into the
      #     newly-staged one before the swap — never generated or
      #     overwritten from repository content.
      #   • node_modules is installed fresh in staging via `npm ci
      #     --omit=dev`, run on the target host itself rather than shipped
      #     over the network.
      #
      # uploads/ (legacy locally-stored candidate documents) lives at the
      # repository root, one level above server/ — this step's path scope
      # never reaches it, so it is never read, moved, or deleted here. New
      # documents already go to the private S3 bucket and are untouched by
      # anything in this workflow.
      #
      # If the service fails to come up on the new release, the symlink is
      # atomically repointed back to the previous (untouched, still-intact)
      # slot and the service restarted from there — the failed build stays
      # on disk in whichever slot it occupied, for inspection, rather than
      # being discarded.
      - name: Deploy backend
        if: needs.validate.outputs.backend-changed == 'true'
        run: |
          set -euo pipefail
          STAGE="/home/${{ secrets.EC2_USER }}/.deploy-staging/server-${{ github.run_id }}"

          # shellcheck disable=SC2086
          ssh $SSH_OPTS "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "mkdir -p '$STAGE'"

          # Only source files the server actually runs — never .env,
          # node_modules, dist/ (unused; production runs TS directly via
          # tsx) or the test suite.
          # shellcheck disable=SC2086
          rsync -az --delete \
            --exclude '.env' --exclude 'node_modules' --exclude 'dist' --exclude 'src/__tests__' \
            -e "ssh $SSH_OPTS" \
            server/ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:$STAGE/"

          # shellcheck disable=SC2086
          ssh $SSH_OPTS "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" bash -s -- "$STAGE" "$BACKEND_LIVE_DIR" <<'REMOTE'
            set -euo pipefail
            STAGE="$1"
            LIVE="$2"
            SLOT_A="${LIVE}-a"
            SLOT_B="${LIVE}-b"
            TMP_LINK="${LIVE}-live-tmp"

            if [ -z "$LIVE" ] || [ "$LIVE" = "/" ] || [ "$LIVE" != "/home/ec2-user/ATS_corps/server" ]; then
              echo "::error::Refusing to deploy — unexpected backend destination: '$LIVE'"
              exit 1
            fi

            if [ -e "$LIVE" ] && [ ! -L "$LIVE" ]; then
              echo "::error::$LIVE exists but is a real directory, not the symlink this step expects — run the one-time migration in DEPLOYMENT.md §3.1 first"
              exit 1
            fi

            if [ ! -f "$LIVE/.env" ]; then
              echo "::error::No .env found in the current live backend directory — aborting rather than deploying without one"
              exit 1
            fi
            cp "$LIVE/.env" "$STAGE/.env"

            ( cd "$STAGE" && npm ci --omit=dev )

            if [ ! -f "$STAGE/.env" ] || [ ! -d "$STAGE/node_modules" ] || [ ! -f "$STAGE/src/index.ts" ]; then
              echo "::error::Staged backend failed its completeness check — refusing to promote"
              exit 1
            fi

            # Compare inode identity, not the symlink's stored path text —
            # a plain string comparison against a readlink result is not
            # reliable if the target was ever created or read through a
            # different (but equivalent) path alias, which silently picks
            # the WRONG "free" slot: the one that is actually live.
            CURRENT_INODE=""
            if [ -e "$LIVE" ]; then
              CURRENT_INODE=$(stat -c %i "$LIVE" 2>/dev/null || true)
            fi
            SLOT_A_INODE=""
            if [ -e "$SLOT_A" ]; then
              SLOT_A_INODE=$(stat -c %i "$SLOT_A" 2>/dev/null || true)
            fi
            CURRENT_TARGET=""
            if [ -n "$CURRENT_INODE" ] && [ "$CURRENT_INODE" = "$SLOT_A_INODE" ]; then
              FREE_SLOT="$SLOT_B"
              CURRENT_TARGET="$SLOT_A"
            else
              FREE_SLOT="$SLOT_A"
              if [ -n "$CURRENT_INODE" ]; then
                CURRENT_TARGET="$SLOT_B"
              fi
            fi

            # Populate the free slot. $LIVE is not touched by anything
            # above this line, so a failure here leaves the current
            # release completely unaffected.
            rm -rf "$FREE_SLOT"
            mv "$STAGE" "$FREE_SLOT"

            # The only step visible to the running system: a single atomic
            # rename of the symlink. Never a window where $LIVE is missing.
            ln -sfn "$FREE_SLOT" "$TMP_LINK"
            mv -T "$TMP_LINK" "$LIVE"
            echo "Backend promoted: $LIVE -> $FREE_SLOT"

            sudo systemctl restart atscorps.service
            sleep 3

            if sudo systemctl is-active --quiet atscorps.service; then
              echo "atscorps.service is active"
            else
              echo "::error::atscorps.service failed to start on the new release — rolling back"
              if [ "$CURRENT_TARGET" != "" ] && [ -d "$CURRENT_TARGET" ]; then
                ln -sfn "$CURRENT_TARGET" "$TMP_LINK"
                mv -T "$TMP_LINK" "$LIVE"
                sudo systemctl restart atscorps.service
                sleep 3
                if sudo systemctl is-active --quiet atscorps.service; then
                  echo "::error::Rolled back to the previous backend release ($CURRENT_TARGET) — it is running. The failed build is kept at $FREE_SLOT for inspection."
                else
                  echo "::error::ROLLBACK ALSO FAILED TO START — manual intervention required. Check $LIVE, $CURRENT_TARGET and $FREE_SLOT."
                  sudo systemctl status atscorps.service --no-pager || true
                fi
              else
                echo "::error::No previous release recorded to roll back to (first-ever deploy?) — manual intervention required. Broken build is at $FREE_SLOT."
              fi
              exit 1
            fi
          REMOTE

      - name: Skip backend deploy (no server/ changes)
        if: needs.validate.outputs.backend-changed != 'true'
        run: echo "No changes under server/ since the previous deploy — backend left untouched, service not restarted."

      # ── Post-deploy health check ──────────────────────────────────────
      # Hits the real public endpoints, not localhost on the box — this
      # confirms Nginx, the backend process and the database are all
      # actually reachable end-to-end, the same way a real user would hit
      # them. Retries tolerate the few seconds a fresh systemd restart
      # needs before the port is accepting connections.
      - name: Verify production health
        run: |
          set -euo pipefail

          echo "Checking frontend…"
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://exservicemanjobs.com/ || echo "000")
            if [ "$CODE" = "200" ]; then echo "Frontend OK (200)"; break; fi
            if [ "$i" = "10" ]; then echo "::error::Frontend did not return 200 after 10 attempts (last: $CODE)"; exit 1; fi
            sleep 3
          done

          echo "Checking backend…"
          for i in $(seq 1 10); do
            BODY=$(curl -s -m 10 https://api.exservicemanjobs.com/api/health || echo "")
            if echo "$BODY" | grep -q '"status":"ok"'; then
              echo "Backend OK: $BODY"
              break
            fi
            if [ "$i" = "10" ]; then
              echo "::error::Backend health check failed after 10 attempts. Last response: $BODY"
              exit 1
            fi
            sleep 3
          done

      - name: Clean up SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/.ssh"
